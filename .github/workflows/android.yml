name: App Android

# Gera o app Android (catálogo Ghost tech + SVI) a partir dos sites em catalogo/ e public/.
# O APK de teste fica em "Artifacts" na página de cada execução, pronto para instalar no celular.
on:
  push:
    paths:
      - 'public/**'
      - 'catalogo/**'
      - 'mobile/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'public/**'
      - 'catalogo/**'
      - 'mobile/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Gerar APK
    runs-on: ubuntu-latest
    env:
      # Segredos não podem ir direto no "if"; a versão de loja só sai quando a chave está cadastrada
      TEM_CHAVE_DE_LOJA: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Instalar dependências
        run: npm ci

      - name: Copiar os sites para o projeto Android
        run: npm run sync

      - name: Testar e compilar APK de teste
        working-directory: mobile/android
        run: ./gradlew testDebugUnitTest assembleDebug

      # A impressão digital deve ser sempre a mesma (chave fixa em mobile/android/app/debug.keystore)
      - name: Conferir assinatura do APK de teste
        working-directory: mobile/android
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep SHA-256

      - uses: actions/upload-artifact@v7
        with:
          name: svi-android-teste
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Versão para a Google Play: cadastre ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS e ANDROID_KEY_PASSWORD em Settings > Secrets and variables > Actions
      - name: Compilar versão de loja (AAB e APK assinados)
        if: env.TEM_CHAVE_DE_LOJA == 'true'
        working-directory: mobile/android
        env:
          SVI_KEYSTORE_FILE: ${{ runner.temp }}/svi-release.jks
          SVI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SVI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SVI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$SVI_KEYSTORE_FILE"
          ./gradlew bundleRelease assembleRelease
          rm -f "$SVI_KEYSTORE_FILE"

      - uses: actions/upload-artifact@v7
        if: env.TEM_CHAVE_DE_LOJA == 'true'
        with:
          name: svi-android-loja
          path: |
            mobile/android/app/build/outputs/bundle/release/app-release.aab
            mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  emulador:
    name: Testar no emulador Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Instalar dependências
        run: npm ci

      - name: Copiar os sites para o projeto Android
        run: npm run sync

      - name: Habilitar aceleração do emulador (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Abre o app: começa no catálogo, leva ao SVI pela demonstração, volta, e abre as páginas sem ".html"
      - name: Rodar o app no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: mobile/android
          # Só os testes do app; os módulos do Capacitor não têm testes próprios
          script: ./gradlew :app:connectedDebugAndroidTest
