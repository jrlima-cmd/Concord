<!DOCTYPE html>

<head>

            <div class="acoes">
                <button class="btn btn-primario" type="button" data-tentar>Tentar de novo</button>
                <button class="btn btn-secundario" type="button" data-voltar>Voltar</button>

        <p class="rodape">
            <a href="/suporte">Suporte</a> · <a href="/privacidade">Privacidade</a> · <a href="/termos">Termos de uso</a>
